<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="420" fill="#14131a"/>

  <text x="600" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8e6e1" text-anchor="middle" letter-spacing="3">TOP PROBLEM INTENTS (ILLUSTRATIVE)</text>
  <text x="600" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a877e" text-anchor="middle" letter-spacing="1">ranked output of the bi-weekly automated alert</text>

  <!-- Header row -->
  <rect x="60" y="85" width="1080" height="40" fill="#1f1e26" stroke="#3a3840" stroke-width="0.5"/>
  <text x="90" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e8e6e1">Intent (example)</text>
  <text x="470" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e8e6e1">Labeler accuracy</text>
  <text x="680" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e8e6e1">Errors on example</text>
  <text x="880" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e8e6e1">Suggested action</text>

  <!-- Rows -->
  <!-- Row 1 -->
  <rect x="60" y="125" width="1080" height="45" fill="#1a191f" stroke="#3a3840" stroke-width="0.5"/>
  <text x="90" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8e6e1">Intent A</text>
  <rect x="440" y="133" width="180" height="28" rx="4" fill="#4a1b0c"/>
  <text x="530" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f0997b" text-anchor="middle">0.00</text>
  <text x="700" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">3</text>
  <text x="880" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">labeling error</text>

  <!-- Row 2 -->
  <rect x="60" y="170" width="1080" height="45" fill="#14131a" stroke="#3a3840" stroke-width="0.5"/>
  <text x="90" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8e6e1">Intent B</text>
  <rect x="440" y="178" width="180" height="28" rx="4" fill="#4a1b0c"/>
  <text x="530" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f0997b" text-anchor="middle">0.00</text>
  <text x="700" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">3</text>
  <text x="880" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">example removed</text>

  <!-- Row 3 -->
  <rect x="60" y="215" width="1080" height="45" fill="#1a191f" stroke="#3a3840" stroke-width="0.5"/>
  <text x="90" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8e6e1">Intent C</text>
  <rect x="440" y="223" width="180" height="28" rx="4" fill="#633806"/>
  <text x="530" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fac775" text-anchor="middle">0.33</text>
  <text x="700" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">2</text>
  <text x="880" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">example corrected</text>

  <!-- Row 4 -->
  <rect x="60" y="260" width="1080" height="45" fill="#14131a" stroke="#3a3840" stroke-width="0.5"/>
  <text x="90" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8e6e1">Intent D</text>
  <rect x="440" y="268" width="180" height="28" rx="4" fill="#412402"/>
  <text x="530" y="287" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#efa123" text-anchor="middle">0.60</text>
  <text x="700" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">2</text>
  <text x="880" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">description corrected</text>

  <!-- Row 5 -->
  <rect x="60" y="305" width="1080" height="45" fill="#1a191f" stroke="#3a3840" stroke-width="0.5"/>
  <text x="90" y="333" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8e6e1">Intent E</text>
  <rect x="440" y="313" width="180" height="28" rx="4" fill="#173404"/>
  <text x="530" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#97c459" text-anchor="middle">0.67</text>
  <text x="700" y="333" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">1</text>
  <text x="880" y="333" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a978f">will merge duplicate</text>

  <!-- Legend -->
  <line x1="60" y1="370" x2="1140" y2="370" stroke="#3a3840" stroke-width="1"/>
  <text x="60" y="398" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e">Color scale: red = lowest labeler accuracy (highest correction priority) → green = closer to acceptable</text>
</svg>
